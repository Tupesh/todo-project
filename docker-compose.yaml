services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    ports:
      - 3000:80
    
    env_file:
      - ./frontend/.env

    depends_on:
      - backend

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    
    ports:
      - 8001:8000

    env_file:
      - ./backend/.env

    depends_on:
      - database

  database:
      image: postgres:15
      container_name: todo-db
      environment:
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: todo_db
      ports:
        - "5432:5432"
      volumes:
        - todo_postgres_data:/var/lib/postgresql/data

volumes:
  todo_postgres_data: