---
- name: Check if worker node already joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Get fresh join command from control plane
  ansible.builtin.command: kubeadm token create --print-join-command
  delegate_to: "{{ groups['k8s_control'][0] }}"
  become: true
  register: kubeadm_join_command
  changed_when: false
  run_once: true

- name: Join worker node to Kubernetes cluster
  ansible.builtin.command: "{{ kubeadm_join_command.stdout }}"
  when: not kubelet_conf.stat.exists