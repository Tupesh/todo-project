---
- name: Install Docker package
  ansible.builtin.apt:
    name:
      - docker.io
    state: present
    update_cache: true

- name: Start and enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Create Jenkins agent directory
  ansible.builtin.file:
    path: /home/ubuntu/jenkins-agent
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Install packages needed for AWS CLI and Trivy
  ansible.builtin.apt:
    name:
      - unzip
      - curl
      - wget
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true

- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
    dest: /tmp/awscliv2.zip
    mode: "0644"

- name: Unzip AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true

- name: Install AWS CLI v2
  ansible.builtin.command: /tmp/aws/install --update
  args:
    creates: /usr/local/bin/aws

- name: Add Trivy GPG key
  ansible.builtin.shell: |
    wget -qO - https://get.trivy.dev/deb/public.key | gpg --dearmor > /usr/share/keyrings/trivy.gpg
  args:
    creates: /usr/share/keyrings/trivy.gpg

- name: Add Trivy apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/trivy.list
    content: "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://get.trivy.dev/deb generic main\n"
    owner: root
    group: root
    mode: "0644"

- name: Install Trivy
  ansible.builtin.apt:
    name: trivy
    state: present

- name: Download SonarScanner CLI
  ansible.builtin.get_url:
    url: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
    dest: /tmp/sonar-scanner-cli.zip
    mode: "0644"

- name: Extract SonarScanner CLI
  ansible.builtin.unarchive:
    src: /tmp/sonar-scanner-cli.zip
    dest: /opt
    remote_src: true
    creates: /opt/sonar-scanner-8.0.1.6346-linux-x64

- name: Create sonar-scanner symlink
  ansible.builtin.file:
    src: /opt/sonar-scanner-8.0.1.6346-linux-x64/bin/sonar-scanner
    dest: /usr/local/bin/sonar-scanner
    state: link
    force: true

- name: Verify SonarScanner installation
  ansible.builtin.command:
    cmd: sonar-scanner --version
  changed_when: false
  update_cache: true