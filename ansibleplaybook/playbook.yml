---
- name: Common setup for all servers
  hosts: servers
  become: true
  roles:
    - serversetup

- name: Prepare Jenkins agent directories
  hosts: jenkins_agents
  become: true

  tasks:
    - name: Create Jenkins agent directory
      ansible.builtin.file:
        path: /home/ubuntu/jenkins-agent
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"