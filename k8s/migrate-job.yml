apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: devops-demo
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: migrate
          image: BACKEND_IMAGE_PLACEHOLDER
          command:
            - sh
            - -c
            - alembic upgrade head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: FRONTEND_ORIGIN
              value: "FRONTEND_ORIGIN_PLACEHOLDER"